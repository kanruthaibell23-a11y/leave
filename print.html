  * { box-sizing: border-box; }
  body { margin:0; background:#e9ecf2; font-family:'Sarabun','TH SarabunPSK',sans-serif; color:#000; }
  .bar { position:sticky; top:0; background:#2457c5; color:#fff; padding:10px 16px; display:flex; gap:12px; align-items:center; z-index:5; font-size:14px; flex-wrap:wrap; }
  .bar select { border:0; border-radius:8px; padding:7px 8px; font:inherit; background:#fff; color:#1d2433; }
  .bar label { font-size:13px; opacity:.9; display:flex; align-items:center; gap:6px; }
  .bar button { border:0; border-radius:8px; padding:8px 18px; font:inherit; cursor:pointer; background:#fff; color:#2457c5; font-weight:600; }
  .bar button:disabled { opacity:.5; cursor:default; }
  .wrap { overflow-x:auto; padding:12px 0; }
  .scaler { transform-origin:0 0; }
  /* ขนาดหน้า = ขนาด PDF ต้นฉบับ (A4 = 595.3 x 841.9 pt) ตำแหน่งทุกช่องอ้างอิงจาก PDF */
  .sheet { position:relative; width:595.3pt; height:841.9pt; margin:0 auto; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.15); overflow:hidden; }
  .sheet img.bg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  .m { position:absolute; background:#fff; }
  .fv { font-family:var(--ff,'Sarabun','TH SarabunPSK',sans-serif); position:absolute; display:flex; align-items:flex-end; justify-content:center; font-size:13pt; line-height:1.15; white-space:nowrap; overflow:hidden; padding-bottom:0; }
  .fv { cursor:text; }
  .fv span { min-width:10pt; outline:none; }
  @media screen { .fv:hover span { background:rgba(36,87,197,.10); outline:1px dashed #2457c5; } .fv span:focus { background:rgba(36,87,197,.14); outline:1px solid #2457c5; } }
  .fv.dot { border-bottom:0.9pt dotted #000; }
  .fv.l { justify-content:flex-start; }
  .fv.b { font-weight:700; }
  .ck { position:absolute; }
  .ckm { position:absolute; left:32%; top:4%; width:28%; height:58%; border:solid #000; border-width:0 1.8pt 1.8pt 0; transform:rotate(45deg); }
  @media print {
    body { background:#fff; }
    .bar { display:none; }
    .wrap { padding:0 !important; overflow:visible !important; height:auto !important; }
    .scaler { transform:none !important; }
    .sheet { margin:0; box-shadow:none; width:210mm; height:297mm; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

<script>
const ID = new URLSearchParams(location.search).get('id') || '';
const MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = s => String(s || '').replace(/\s+/g, '');
function parts(iso) { if (!iso) return null; const p = iso.slice(0,10).split('-').map(Number); return { d:p[2], m:p[1], y:p[0]+543 }; }
function partSfx(p) { return p === 'AM' ? ' (เช้า)' : p === 'PM' ? ' (บ่าย)' : ''; }
function longDate(iso) { const p = parts(iso); return p ? p.d + ' ' + MONTHS_FULL[p.m-1] + ' ' + p.y : ''; }

/* แบ่งข้อความตำแหน่งเป็น 2 บรรทัด: ใช้ \n ถ้ามี, ตัดหลัง 'รักษาราชการแทน' ถ้ามี, ไม่งั้นแบ่งที่ช่องว่างใกล้กึ่งกลางเมื่อยาวเกิน 34 ตัวอักษร */
function splitTwo(t) {
  t = String(t || '').trim();
  if (!t) return ['', ''];
  if (t.indexOf('|') > -1) { const a = t.split('|'); return [a[0].trim(), a.slice(1).join(' ').trim()]; }
  if (t.indexOf('\n') > -1) { const a = t.split('\n'); return [a[0].trim(), a.slice(1).join(' ').trim()]; }
  const key = 'รักษาราชการแทน', i = t.indexOf(key);
  if (i > -1 && i + key.length < t.length) return [t.slice(0, i + key.length).trim(), t.slice(i + key.length).trim()];   // บรรทัด 1 = ตำแหน่ง + รักษาราชการแทน, บรรทัด 2 = ผู้อำนวยการ...
  return ['', t];                                   // ไม่มีจุดตัดบรรทัด = บรรทัดเดียว (ไม่ตัดกลางคำ) ถ้ายาวเกินช่องจะย่อขนาดให้พอดี
}

/* (ฉบับแก้ไขของแบบ A ไม่มีชื่อพิมพ์ไว้แล้ว) */

/* ช่องกรอก: (x1, x2, เส้นประ y) หน่วย pt วัดจาก PDF ต้นฉบับ */
const H = 22;                       // ความสูงกล่องข้อความ
function box(x1, x2, uy, text, o) {
  o = o || {};
  const bottom = uy + (o.dy == null ? 2.5 : o.dy);
  return '<div class="fv' + (o.dot ? ' dot' : '') + (o.left ? ' l' : '') + (o.bold ? ' b' : '') + '" data-fs="' + (o.fs || 13) + '"' + (o.maxpt ? ' data-max="' + o.maxpt + '"' : '') + (o.grp ? ' data-grp="' + o.grp + '"' : '') + ' style="left:' + x1 + 'pt;width:' + (x2 - x1) + 'pt;top:' + (bottom - H) + 'pt;height:' + H + 'pt"><span contenteditable="true" spellcheck="false">' + esc(text) + '</span></div>';
}
function mask(x1, y1, x2, y2) { return '<div class="m" style="left:' + x1 + 'pt;top:' + y1 + 'pt;width:' + (x2 - x1) + 'pt;height:' + (y2 - y1) + 'pt"></div>'; }
function tick(x1, y1, x2, y2) {
  return '<div class="ck" style="left:' + x1 + 'pt;top:' + y1 + 'pt;width:' + (x2 - x1) + 'pt;height:' + (y2 - y1) + 'pt"><div class="ckm"></div></div>';
}
/* วันที่ แบบ __ / __ / __ */
function dateBoxes(iso, xs, uy) {
  const p = parts(iso); if (!p) return '';
  return box(xs[0][0], xs[0][1], uy, p.d) + box(xs[1][0], xs[1][1], uy, p.m) + box(xs[2][0], xs[2][1], uy, p.y);
}



var PDF_NAME;

/* ฟอนต์ของข้อความที่ระบบพิมพ์ลงใบลา (ตั้งค่าเริ่มต้นได้ที่ชีต Config: fontName, fontScale) */
const FONTS = ['TH Sarabun New','Sarabun','Noto Sans Thai','Noto Serif Thai','Prompt','Kanit','Niramit','K2D','Krub','Athiti','Pridi','Taviraj','Mali','Itim','Charmonman'];
const FONT_LABEL = { 'TH Sarabun New':'TH Sarabun New (สารบรรณ)', 'Sarabun':'Sarabun (Google)', 'Mali':'Mali (ลายมือ)', 'Itim':'Itim (ลายมือ)', 'Charmonman':'Charmonman (ลายมือเขียน)' };
var BASE_PT = 16;           // ขนาดตัวอักษรหลัก (pt) ; ช่องเล็ก/ช่องตาราง ปรับตามสัดส่วนอัตโนมัติ
(function () { document.getElementById('fontSel').innerHTML = FONTS.map(f => '<option value="' + f + '">' + (FONT_LABEL[f] || f) + '</option>').join(''); })();
function applyFont(name, size) {
  if (FONTS.indexOf(name) < 0) name = 'TH Sarabun New';
  size = Number(size); if (!(size >= 8 && size <= 28)) size = 16;
  BASE_PT = size;
  document.getElementById('fontSel').value = name;
  document.getElementById('sizeSel').value = String(size);
  document.documentElement.style.setProperty('--ff', "'" + name + "','TH Sarabun New','Sarabun','TH SarabunPSK',sans-serif");
  return (document.fonts && document.fonts.load) ? document.fonts.load('16pt "' + name + '"', 'กขค').catch(() => {}) : Promise.resolve();
}
function onFontChange() {
  const name = document.getElementById('fontSel').value, size = document.getElementById('sizeSel').value;
  try { localStorage.setItem('leave_font_v2', JSON.stringify({ name: name, size: size })); } catch (e) {}
  applyFont(name, size).then(fit);
}

/* ตำแหน่ง + แถว "วันที่" ของผู้ลงนาม (หัวหน้า/ผู้รับรอง ฯลฯ)
   - ตำแหน่งบรรทัดเดียว: เขียนบนเส้นประเดิม
   - ตำแหน่ง 2 บรรทัด (มี "รักษาราชการแทน" หรือ "|"): ลบแถว "ตำแหน่ง ....." และแถว "วันที่" เดิมของ PDF
     แล้วเขียน 2 บรรทัดกึ่งกลางใต้ชื่อ และวาดแถว "วันที่" ใหม่ให้ต่ำลง (shift pt) */
/* ตำแหน่งผู้อำนวยการ: ถ้ามีช่อง "บรรทัดที่ 2" ใช้ 2 บรรทัดตามนั้น ไม่เช่นนั้นแบ่งอัตโนมัติ (รักษาราชการแทน / |) หรือบรรทัดเดียว */
function dirLines(x) {
  const p1 = String(x.dirP || '').trim(), p2 = String(x.dirP2 || '').trim();
  return p2 ? [p1, p2] : posLines(p1);
}

function posDateBlock(o) {
  const p2 = String(o.pos2 || '').trim();
  const pl = p2 ? [String(o.posText || '').trim(), p2] : posLines(o.posText);       // มีช่อง "บรรทัดที่ 2" -> 2 บรรทัดเสมอ ; ไม่มีก็ใช้การแบ่งอัตโนมัติ (รักษาราชการแทน / |)
  if (!pl[1]) return box(o.pos[0], o.pos[1], o.pos[2], o.posText, Object.assign({ dy: o.dy }, o.opt || {})) + dateBoxes(o.date, o.segs, o.dateUy);
  const t = o.two, sh = t.shift, top = t.posTop + 1.2, area = (t.dateTop + sh - 1) - top;
  const margin = area > 26 ? 4 : 1, usable = area - margin;            // เว้นระยะเหนือแถว "วันที่" (พื้นที่น้อยเว้นน้อยลง)
  const pt = Math.min(12, usable / 2 * 0.95), grp = 'pb' + Math.round(t.posTop);
  const L = { dy: 0, fs: 12, maxpt: pt, grp: grp };
  let h = mask(t.mx1, top, t.mx2, t.dateTop + 0.5) + mask(t.dx1, t.dateTop + 0.5, t.dx2, t.dateTop + 21);
  h += box(t.cx - t.half, t.cx + t.half, top + usable / 2 + 0.8, pl[0], L) + box(t.cx - t.half, t.cx + t.half, top + usable, pl[1], L);
  const uy = o.dateUy + sh, p = parts(o.date), sg = o.segs;
  h += box(t.dx1 + 2, t.labelEnd + 1, uy, 'วันที่', { left: true, dy: 0, fs: 12 });
  sg.forEach((s, i) => {
    h += box(s[0], s[1], uy, p ? String([p.d, p.m, p.y][i]) : '', { dot: true, dy: 0 });
    if (i < 2) { const c = (s[1] + sg[i + 1][0]) / 2; h += box(c - 6, c + 6, uy, '/', { dy: 0 }); }
  });
  return h;
}

function layoutGeneral(x) {
  const { r, c, s, cp, inspN, inspP, certN, certP, dirN, dirP } = x;
  let h = '';

  // ชื่อฟอร์มตามประเภทบุคลากร (จ้างเหมาบริการ = ใช้ข้อความในต้นฉบับ PDF ; ประเภทอื่น = ลบแล้วเขียนทับ)
  const TITLES = { GOV_EMP: 'ใบลาพนักงานราชการ', TEMP: 'ใบลาลูกจ้างชั่วคราว' };
  if (TITLES[r.staffType]) h += mask(268, 76, 384, 101) + box(240, 412, 97.5, TITLES[r.staffType], { dy: 0.5, fs: 12, bold: true });
  // วันที่เขียน
  h += box(343, 378, 147, cp.d) + box(404, 498, 147, cp.d ? MONTHS_FULL[cp.m - 1] : '') + box(518, 566, 147, cp.y);
  // ข้อมูลผู้ลา
  h += box(155, 318, 224.6, r.name) + box(359, 560, 224.6, r.position);
  h += box(142, 318, 251.4, r.group) + box(348, 560, 251.4, r.affiliation);
  h += box(152, 298, 278.2, longDate(r.startDate) + partSfx(r.startPart)) + box(330, 434, 278.2, longDate(r.endDate) + partSfx(r.endPart)) + box(475, 527, 278.2, r.days);
  h += box(227, 574, 299, r.contact);
  // ตารางสถิติ (ข้างใน 80-148 / 148-220 / 220-290, สูง 409-448)
  const cell = (x1, x2, v) => '<div class="fv" data-fs="15" style="left:' + x1 + 'pt;width:' + (x2 - x1) + 'pt;top:409pt;height:39pt;align-items:center"><span contenteditable="true" spellcheck="false">' + v + '</span></div>';
  h += cell(80, 148, s.before) + cell(148, 220, s.current) + cell(220, 290, s.total);
  // ผู้ขอลา ลงชื่อ (ว่างไว้เซ็น) / ชื่อในวงเล็บ / ตำแหน่ง
  h += box(369, 541, 419.9, r.name) + box(382, 538, 439.9, r.position);

  // หัวหน้ากลุ่ม/ฝ่าย
  h += box(367, 540, 540.6, r.headName);
  h += posDateBlock({ posText: r.headPosition, pos2: r.headPosition2, pos: [380, 536, 560.6], dy: 2.5, date: r.headAt, segs: [[404, 428], [435, 460], [467, 496]], dateUy: 580.8,
    two: { posTop: 547.8, mx1: 340, mx2: 541, cx: 453.5, half: 105, dateTop: 568.0, dx1: 380, dx2: 502, labelEnd: 401.6, shift: 14 } });

  // ผู้ตรวจสอบ (แบบฟอร์มฉบับแก้ไข: ช่องชื่อ/ตำแหน่งว่าง ไม่มีข้อความพิมพ์ไว้แล้ว)
  h += box(105, 231, 518, inspN, { dy: 1.8 }) + box(114, 256, 538.25, inspP, { dy: 1.8, fs: 12 });
  h += dateBoxes(r.inspectAt, [[96, 123.2], [128, 155.2], [159.8, 190.8]], 556.25);

  // ผู้รับรอง
  h += box(107, 249, 642.25, certN, { dy: 1.8 });
  h += posDateBlock({ posText: certP, pos2: r.certifierPosition2, pos: [113, 268, 662.25], dy: 1.8, opt: { fs: 12 }, date: r.certAt, segs: [[95, 122.2], [127, 154.5], [159, 189.8]], dateUy: 680.5,
    two: { posTop: 648.5, mx1: 74, mx2: 272, cx: 178, half: 100, dateTop: 666.6, dx1: 74, dx2: 195, labelEnd: 95, shift: 12 } });

  // คำสั่ง ผอ.
  if (r.dirDecision === 'อนุญาต') h += tick(393.4, 620.2, 407.6, 637);
  if (r.dirDecision === 'ไม่อนุญาต') h += tick(488.6, 620.2, 502.9, 637);
  let n1 = r.dirNote || '', n2 = '';
  if (n1.length > 40) { const mid = Math.floor(n1.length / 2); let cut = n1.indexOf(' ', mid - 8); if (cut < 0 || cut > mid + 10) cut = mid; n2 = n1.slice(cut).trim(); n1 = n1.slice(0, cut).trim(); }
  h += box(372, 541, 657.2, n1) + box(372, 541, 681.4, n2);
  h += box(372, 541, 750.8, dirN);
  // ตำแหน่ง ผอ./ผู้รักษาราชการแทน: ยาวได้ แบ่ง 2 บรรทัด (ขึ้นบรรทัดเองด้วย \n หรือให้ระบบแบ่งให้)

  h += mask(345, 759.5, 548, 779) + mask(385, 779.2, 548, 800);
  const lines = dirLines(x);
  // จัดกึ่งกลางใต้ชื่อในวงเล็บ (กึ่งกลางชื่อ ≈ x 456 pt) ; ไม่ใช้คำว่า "ตำแหน่ง" และเส้นประ เพื่อให้กึ่งกลางสวยงาม
  h += box(350, 562, 770.5, lines[0], { dy: 1, fs: 12.5, grp: 'dirpos' });
  h += box(350, 562, 787.5, lines[1], { dy: 1, fs: 12.5, grp: 'dirpos' });
  // วันที่ (เลื่อนลงมา และจัดให้อยู่กึ่งกลางเดียวกัน) : วันที่ __ / __ / __
  const dp = parts(r.dirAt), dyU = 806, sx = 9.5;
  h += box(387 + sx, 412 + sx, dyU, 'วันที่', { left: true, dy: 0 });
  h += box(414 + sx, 436 + sx, dyU, dp ? dp.d : '', { dot: true, dy: 0 }) + box(433 + sx, 445 + sx, dyU, '/', { dy: 0 });
  h += box(442 + sx, 466 + sx, dyU, dp ? dp.m : '', { dot: true, dy: 0 }) + box(463 + sx, 475 + sx, dyU, '/', { dy: 0 });
  h += box(472 + sx, 506 + sx, dyU, dp ? dp.y : '', { dot: true, dy: 0 });

  // มอบหมายงาน
  h += box(88, 214, 756.2, r.delegateName);
  return h;
}

/* ---------- ตัวช่วยจัดรูปแบบตัวเลข/วันที่ ---------- */
const fmtN = v => (v === '' || v == null || isNaN(Number(v))) ? '' : String(Math.round(Number(v) * 10) / 10);
const MONTHS_ABBR = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function abbrDate(iso) { const p = parts(iso); return p ? p.d + ' ' + MONTHS_ABBR[p.m - 1] + ' ' + p.y : ''; }

/* ---------- ตัวช่วยร่วมของแบบใหม่ (C, D) ---------- */
const LV_NAME = { SICK: 'ป่วย', PERSONAL: 'กิจส่วนตัว', MATERNITY: 'คลอดบุตร', VACATION: 'พักผ่อน' };
function posLines(p, wideOnly) {                      // 1 บรรทัด หรือ 2 บรรทัด (รักษาราชการแทน / | / ขึ้นบรรทัดใหม่)
  const s = String(p || '').trim();
  if (/\||\n|รักษาราชการแทน\s*\S/.test(s)) { const tw = splitTwo(s); return tw[0] ? [tw[0], tw[1]] : [tw[1], '']; }
  return [s, ''];
}
const DOT = { dot: true, dy: 0 };                      // ช่องที่ PDF ต้นฉบับไม่มีเส้นประ -> วาดเส้นประเอง
function dateRow(iso, xs, uy) { return dateBoxes(iso, xs, uy); }

  const boxY = { SICK: 224, PERSONAL: 242, MATERNITY: 260.2 }, lastX = { SICK: 125.2, PERSONAL: 182, MATERNITY: 262.2 };

  h += b(239, 558, 252.75, r.reason);                                          // เนื่องจาก
  h += b(99, 266, 288.75, abbrDate(r.startDate) + partSfx(r.startPart)) + b(292, 454, 288.75, abbrDate(r.endDate) + partSfx(r.endPart)) + b(485, 537, 288.75, fmtN(r.days));
  if (last && lastX[lt]) {                                                      // ข้าพเจ้าได้ลา ... ครั้งสุดท้าย
    h += tick(lastX[lt], 296.2, lastX[lt] + 11.8, 307.8);

  }
  h += b(215, 552, 343, r.contact);

  // ตารางสถิติแยกประเภท
  Object.keys(rowY).forEach(k => {

  });
  // ความเห็นผู้บังคับบัญชา (หัวหน้า) – บรรทัดความเห็นเว้นไว้เขียน
  h += b(391, 529, 545.5, r.headName);
  h += posDateBlock({ posText: r.headPosition, pos2: r.headPosition2, pos: [391, 552, 563.75], dy: 1.8, opt: { fs: 12 }, date: r.headAt, segs: [[392, 430], [437, 499], [506, 552]], dateUy: 581.75,
    two: { posTop: 551.4, mx1: 352, mx2: 557, cx: 460, half: 100, dateTop: 569.4, dx1: 370, dx2: 558, labelEnd: 391.5, shift: 14 } });
  // ผู้ตรวจสอบ (แบบฟอร์มฉบับแก้ไข: ชื่อ/ตำแหน่งเป็นเส้นประว่างให้กรอก)
  h += b(105, 221, 610.75, inspN) + b(102, 248, 628.75, inspP, { fs: 12 });
  h += dateRow(r.inspectAt, [[92, 133], [137.8, 202.2], [206.8, 251.2]], 645.25);
  // ผู้รับรอง
  h += b(117, 223, 689.25, certN);
  h += posDateBlock({ posText: certP, pos2: r.certifierPosition2, pos: [100, 245, 707.5], dy: 1.8, opt: { fs: 12 }, date: r.certAt, segs: [[97.2, 138.5], [143, 207.5], [212, 256.5]], dateUy: 724,

  // คำสั่ง
  if (r.dirDecision === 'อนุญาต') h += tick(343.5, 644, 355.2, 655.5);
  if (r.dirDecision === 'ไม่อนุญาต') h += tick(415.5, 644, 427.2, 655.5);
  h += b(345, 560, 683, r.dirNote);
  h += b(373, 515, 729.25, dirN);
  const pl = dirLines(x);

  h += dateRow(r.dirAt, [[375.8, 417], [421.5, 486], [490.5, 522.2]], 765.25);
  h += b(72, 205, 788.5, r.delegateName);            // ให้ ... เป็นผู้ดำเนินการแทน
  return h;
}

function render(data) {
  const r = data.req, c = data.cfg, s = data.stats;
  PDF_NAME = ('ใบลา-' + r.name + '-' + r.startDate).replace(/[\\\/:*?"<>|\s]+/g, '_');
  document.getElementById('info').textContent = 'เลขที่ ' + r.id + ' · ' + r.name;

  const cp = parts(r.writeDate || r.createdAt) || { d: '', m: 1, y: '' };
  const inspN = r.inspectorName || c.inspectorName || '', inspP = r.inspectorPosition || c.inspectorPosition || '';
  const certN = r.certifierName || c.certifierName || '', certP = r.certifierPosition || c.certifierPosition || '';
  const dirN = r.directorName || r.dirBy || c.directorName || '', dirP = r.directorPosition || c.directorPosition || '';
  let fnt = { name: c.fontName || 'TH Sarabun New', size: c.fontSize || 16 };
  try { const sv = JSON.parse(localStorage.getItem('leave_font_v2') || 'null'); if (sv) fnt = sv; } catch (e) {}
  const fontReady = applyFont(fnt.name, fnt.size);
  const x = { r: r, c: c, s: s, cp: cp, inspN: inspN, inspP: inspP, certN: certN, certP: certP, dirN: dirN, dirP: dirP, dirP2: r.directorPosition2 || '', vac: data.vac };
  x.last = data.last; x.sbt = data.statsByType;
  // เลือกแบบฟอร์ม: A = ใบลาทั่วไป (จ้างเหมา) · C = ใบลาพักผ่อน (พนักงานราชการ/ลูกจ้างชั่วคราว) · D = ใบลาป่วย/กิจ/คลอดบุตร
  const FORM_LEAVES = ['SICK', 'PERSONAL', 'MATERNITY'];
  const form = r.leaveType === 'VACATION' ? 'C' : (FORM_LEAVES.indexOf(r.leaveType) > -1 ? 'D' : 'A');
  ['A', 'C', 'D'].forEach(k => document.getElementById('bg' + k).style.display = k === form ? '' : 'none');
  const h = { A: layoutGeneral, C: layoutVacTemp, D: layoutSick }[form](x);

  document.getElementById('ov').innerHTML = h;
  wireEdit(); fitScreen();
  const run = () => { fit(); document.getElementById('btnPdf').disabled = false; };
  fontReady.then(() => (document.fonts && document.fonts.ready ? document.fonts.ready : null)).then(run);
}

/* ย่อหน้ากระดาษ A4 ให้พอดีความกว้างจอ (มือถือ) ; ตอนพิมพ์/สร้าง PDF จะกลับเป็นขนาดจริง */
function fitScreen() {
  const sc = document.getElementById('scaler'), wrap = document.getElementById('wrap');
  const need = 595.3 * 96 / 72, k = Math.min(1, (document.documentElement.clientWidth - 8) / need);
  if (k < 1) {
    sc.style.transform = 'scale(' + k + ')'; sc.style.width = need + 'px';
    document.getElementById('sheet').style.margin = '0';
    wrap.style.height = (841.9 * 96 / 72 * k + 24) + 'px'; wrap.style.overflow = 'hidden';
  } else { sc.style.transform = ''; sc.style.width = ''; document.getElementById('sheet').style.margin = ''; wrap.style.height = ''; wrap.style.overflow = ''; }
}
window.addEventListener('resize', fitScreen); window.addEventListener('load', fitScreen);

function wireEdit() {
  const ov = document.getElementById('ov');
  ov.onclick = e => { const fv = e.target.closest('.fv'); if (fv && fv.firstChild && e.target === fv) fv.firstChild.focus(); };
  ov.oninput = () => fit();
  ov.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ')); };
  ov.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } };
}

function fit() {
  document.querySelectorAll('.fv').forEach(el => {
    const sp = el.firstChild; let fs = parseFloat(el.dataset.fs || 13) * BASE_PT / 13;
    if (el.dataset.max) fs = Math.min(fs, parseFloat(el.dataset.max));
    el.style.fontSize = fs + 'pt';
    while (sp.offsetWidth > el.clientWidth - 1 && fs > 6) { fs -= 0.5; el.style.fontSize = fs + 'pt'; }
  });
  // ช่องที่อยู่กลุ่มเดียวกัน (เช่น ตำแหน่ง 2 บรรทัด) ใช้ขนาดเล็กสุดร่วมกัน ให้ดูเท่ากัน
  const g = {};
  document.querySelectorAll('.fv[data-grp]').forEach(el => { const k = el.dataset.grp, s = parseFloat(el.style.fontSize); g[k] = Math.min(g[k] || 99, s); });
  document.querySelectorAll('.fv[data-grp]').forEach(el => { el.style.fontSize = g[el.dataset.grp] + 'pt'; });
}

async function savePdf() {
  const btn = document.getElementById('btnPdf');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง PDF...';
  try {
    await applyFont(document.getElementById('fontSel').value, document.getElementById('sizeSel').value);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(document.getElementById('sheet'), {
      scale: 3, useCORS: true, backgroundColor: '#ffffff', windowWidth: 1000,
      onclone: doc => { const p = doc.getElementById('sheet'); p.style.boxShadow = 'none'; p.style.margin = '0';
        const sc = doc.getElementById('scaler'); sc.style.transform = 'none'; sc.style.width = 'auto'; const w = doc.getElementById('wrap'); w.style.height = 'auto'; w.style.overflow = 'visible'; }
    });
    const img = canvas.toDataURL('image/jpeg', 0.95);
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    pdf.addImage(img, 'JPEG', 0, 0, 210, 297);
    pdf.save((PDF_NAME || 'leave') + '.pdf');
  } catch (e) {
    alert('สร้าง PDF ไม่สำเร็จ: ' + (e.message || e) + '\nลองกดปุ่ม "พิมพ์" แล้วเลือก "บันทึกเป็น PDF" แทน');
  } finally { btn.disabled = false; btn.textContent = '⬇ ดาวน์โหลด PDF'; }
}

/* เริ่มโหลดข้อมูลหลังประกาศฟังก์ชัน/ตัวแปรทั้งหมดแล้ว */
google.script.run.withSuccessHandler(render)
  .withFailureHandler(e => { document.getElementById('info').textContent = 'เกิดข้อผิดพลาด: ' + (e.message || e); })
  .getPrintData(ID);
</script>
